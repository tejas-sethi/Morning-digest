# ============================================================
# Daily Digest configuration — v2, goal-biased
# Edit in GitHub (pencil icon), commit, applies next run.
# ============================================================

timezone: "Australia/Melbourne"

# Interests in priority order (curation weights toward the top)
interests:
  - "Melbourne property/housing market - actively house-hunting, buying by October/November 2026"
  - "NDIS registration, positive behaviour support and disability sector policy - launching a PBS business, NDIS Safeguard and Quality portal application due end of this month"
  - "Business, startups and investing - ASX, gold markets (with a US-policy lens on gold price), small business"
  - "Football: Premier League, Champions League, FIFA World Cup, and all major transfer window news (transfer market currently in its final stages) - Manchester United especially, with Fabrizio Romano as the trusted verification source"
  - "AI and semiconductors - new models, practical tips and tricks for using AI effectively, and general tech"
  - "Vibe coding / personal software projects - project ideas, tools, learning GitHub and basic bookkeeping"
  - "Australian politics, federal budget and government finance"
  - "US policy and geopolitics, especially where it affects markets and gold"
  - "Fitness and running - training toward a 5km run and body composition goal by December"
  - "Mythological fiction and fantasy reading - currently partway through Lord of the Rings"
  - "New cars in the Australian market - used to be really into cars, still like to stay across releases, with a bigger emphasis on EVs"
  - "Light daily astrology/numerology in the style of Rise with Rishabh (panchang-style, entertaining not serious)"

exclusions:
  - celebrity gossip
  - graphic crime reporting
  - far-right commentary beyond basic factual polling numbers - no amplification of rhetoric
  - stories centred on racism toward Indians or anti-immigrant hate, beyond a factual headline-level mention if genuinely major news

# Personal goals with target dates. The AI curator uses these to weight
# coverage more heavily as deadlines approach - e.g. more housing content
# as October nears, more NDIS content approaching end-of-month, fitness
# content ramping toward December.
goals:
  - name: "NDIS Safeguard and Quality portal application"
    deadline: "2026-07-31"
    note: "Policies and procedures need to be finalised and submitted."
  - name: "Buy first home in Melbourne"
    deadline: "2026-11-01"
    note: "Watching the Melbourne housing market closely in the lead-up."
  - name: "Fitness: visible abs and comfortable 5km run"
    deadline: "2026-12-31"
    note: "Currently in weight-loss and injury-recovery phase; workouts, nutrition, running."
  - name: "Start working in Lumen (NDIS PBS business)"
    deadline: "2027-01-15"
    note: "Business launch follows the NDIS registration and October audit window."

