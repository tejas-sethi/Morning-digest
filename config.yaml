slots:
  morning_7am:
    label: "☀️ Morning Briefing"
    items_core: 4
    items_stretch: 1
    items_humour: 0
    theme: >
      Lead with anything goal-critical (housing market movement, NDIS
      regulatory news, ASX/gold), then top Australian and world news.
      Include any overnight football results, especially Manchester United.
      Weight coverage toward goals whose deadline is under 30 days away.
      Concise and energising - reader has room to be stretched today.
  mid_9am:
    label: "🏠 Mid-morning Focus"
    items_core: 3
    items_stretch: 0
    items_humour: 0
    theme: >
      Deeper focus on whichever active goal is most time-critical right
      now given today's date vs the goal deadlines provided - Melbourne
      housing market data, NDIS/disability sector regulatory updates, or
      business news, depending on proximity to deadline.
  late_11am:
    label: "🤖 Tech & AI Check-in"
    items_core: 2
    items_stretch: 1
    items_humour: 0
    theme: >
      AI/semiconductor news, practical AI usage tips, and any GitHub or
      basic bookkeeping learning resources worth surfacing. Include one
      vibe-coding project idea if a good one appears in sources or can be
      reasonably suggested from current tech trends. Also include any
      notable new car releases in the Australian market, with a bigger
      emphasis on EVs, when available from CarExpert or Budget Direct.
      Blend a stretch item in naturally.
  midday_1pm:
    label: "📈 Markets & Transfers"
    items_core: 4
    items_stretch: 0
    items_humour: 0
    theme: >
      ASX/gold movements with a note on any US policy driving gold price.
      The transfer window is entering its final stages - cover the biggest
      transfer moves across the Premier League and Champions League broadly
      (not just Manchester United, though always include United news when
      there is any), prioritising deals that are close to completion or
      confirmed. Treat Fabrizio Romano as the trusted verification source:
      anything he has confirmed can be reported as reliable; rumours only
      sourced elsewhere should be flagged as speculative.
  arvo_3pm:
    label: "🏛️ Politics & World"
    items_core: 3
    items_stretch: 1
    items_humour: 0
    theme: >
      Australian politics and federal budget/finance, US policy and
      geopolitics. Far-right coverage limited strictly to factual polling
      or election results - no amplification of rhetoric or incidents.
      Weave the stretch item in unlabelled.
  evening_6pm:
    label: "😄 Evening Wind-down"
    items_core: 1
    items_stretch: 0
    items_humour: 3
    theme: >
      Aussie satire, a light mythological-fiction/fantasy book note or
      reading-world item if available (LOTR-adjacent), and a short
      entertaining daily astrology/numerology flavour item in the spirit
      of a panchang-style daily reading. Nothing heavy. End the day light.

# Sunday-only bonus slot: connects the week's news back to active goals.
weekly_checkin:
  enabled: true
  label: "🎯 Weekly Goal Check-in"
  items_core: 5
  theme: >
    A goal-focused weekly wrap. For each active goal in the goals list,
    surface anything from this week relevant to it: Melbourne housing
    market movement, NDIS/disability sector regulatory news, ASX/gold
    performance, and any fitness/running content worth a nudge. Note how
    many days remain until each goal's deadline. Encouraging, practical
    tone - this is a compass check, not a scold.

# Weekend: one relaxed morning digest only (other daily slots skip)
weekend:
  mode: morning_only
  label: "☕ Weekend Digest"
  items_core: 5
  items_stretch: 1
  items_humour: 2
  theme: >
    Relaxed weekend read: Manchester United match previews/results first
    (weekend is match time), the biggest transfer window moves across
    the Premier League and Champions League as the window nears its close
    (Fabrizio Romano as the trusted source for confirmations), the week's
    best business/housing/NDIS reads, and a couple of laughs. Unhurried
    tone.

guardrails:
  include_links: true
  max_daily_items: 20
  label_stretch_items: false   # blended in, unlabelled
  label_fact_check_items: true # fact_check-mode items get a verification note

delivery:
  page_url: "https://tejas-sethi.github.io/Morning-digest/"

ai:
  model: claude-sonnet-4-6
  max_candidates_per_feed: 10
