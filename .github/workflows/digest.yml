name: Daily Digest Drip

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to send"
        required: true
        default: morning_7am
  schedule:
    # UTC times. Melbourne = UTC+10 (AEST) / UTC+11 (AEDT Oct-Apr: subtract 1h from each).
    - cron: "0 21 * * *"   # 7:00am Melbourne  -> morning_7am
    - cron: "0 23 * * *"   # 9:00am Melbourne  -> mid_9am
    - cron: "0 1 * * *"   # 11:00am Melbourne -> late_11am
    - cron: "0 3 * * *"   # 1:00pm Melbourne  -> midday_1pm
    - cron: "0 5 * * *"   # 3:00pm Melbourne  -> arvo_3pm
    - cron: "0 8 * * *"   # 6:00pm Melbourne  -> evening_6pm
    - cron: "0 6 * * 0"   # 4:00pm Melbourne, Sundays only -> weekly_checkin

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser pyyaml

      - name: Work out which slot this run is
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 21 * * *") echo "slot=morning_7am"     >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *") echo "slot=mid_9am"         >> "$GITHUB_OUTPUT" ;;
              "0 1 * * *") echo "slot=late_11am"       >> "$GITHUB_OUTPUT" ;;
              "0 3 * * *") echo "slot=midday_1pm"      >> "$GITHUB_OUTPUT" ;;
              "0 5 * * *") echo "slot=arvo_3pm"        >> "$GITHUB_OUTPUT" ;;
              "0 8 * * *") echo "slot=evening_6pm"     >> "$GITHUB_OUTPUT" ;;
              "0 6 * * 0") echo "slot=weekly_checkin"  >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python digest.py --slot "${{ steps.slot.outputs.slot }}"

      - name: Publish updated app page
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Digest: ${{ steps.slot.outputs.slot }}"
            git pull --rebase --autostash origin main
            git push
          fi
